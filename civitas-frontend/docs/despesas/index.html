<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Despesas — Civitas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <!-- ==================== SIDEBAR ==================== -->
      <aside class="sidebar" aria-label="Sidebar">
        <div class="sidebar__top">
          <!-- Brand -->
          <div class="sidebar__brand">
            <div class="sidebar__logo">
              <img src="../../public/logo.png" alt="Logo Civitas" onerror="this.style.display='none'" />
            </div>
            <div class="sidebar__brand-name">Civitas</div>
          </div>

          <!-- Nav -->
          <nav class="sidebar__nav">
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard'">
              <span class="sidebar__nav-icon material-symbols-outlined">home</span>
              <span class="sidebar__nav-label">Home</span>
            </button>
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard/secretaria'">
              <span class="sidebar__nav-icon material-symbols-outlined">account_balance</span>
              <span class="sidebar__nav-label">Secretaria</span>
            </button>
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard/instituicoes'">
              <span class="sidebar__nav-icon material-symbols-outlined">flowchart</span>
              <span class="sidebar__nav-label">Instituição</span>
            </button>
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard/fornecedor'">
              <span class="sidebar__nav-icon material-symbols-outlined">box</span>
              <span class="sidebar__nav-label">Fornecedor</span>
            </button>
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard/orcamentos'">
              <span class="sidebar__nav-icon material-symbols-outlined">request_quote</span>
              <span class="sidebar__nav-label">Orçamento</span>
            </button>
            <button class="sidebar__nav-btn active" aria-current="page">
              <span class="sidebar__nav-icon material-symbols-outlined filled">sell</span>
              <span class="sidebar__nav-label">Despesas</span>
            </button>
            <button class="sidebar__nav-btn" onclick="location.href='/dashboard/usuarios'">
              <span class="sidebar__nav-icon material-symbols-outlined">group</span>
              <span class="sidebar__nav-label">Usuários</span>
            </button>
          </nav>
        </div>

        <!-- Profile -->
        <div class="sidebar__bottom">
          <button class="sidebar__profile-btn" onclick="location.href='/perfil'">
            <div class="sidebar__profile-avatar">
              <span class="material-symbols-outlined">person</span>
            </div>
            <span class="sidebar__profile-label">Perfil</span>
          </button>
        </div>
      </aside>

      <!-- ==================== MAIN ==================== -->
      <main class="main">
        <!-- Page Header -->
        <div class="page-header">
          <h1 class="page-header__title">despesas</h1>
          <div class="page-header__breadcrumb">
            <span class="page-header__breadcrumb-item" onclick="location.href='/dashboard'">dashboard &gt;</span>
            <span class="page-header__breadcrumb-item">despesas</span>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="searchbar">
          <div class="searchbar__header">
            <p>Busca:</p>
            <p>Aqui você busca e filtra</p>
          </div>

          <div class="searchbar__main-row">
            <input
              id="inputDescricao"
              class="searchbar__input"
              type="text"
              placeholder="Descrição"
              oninput="filtrarTabela()"
            />

            <div class="searchbar__actions">
              <button class="btn btn--primary" onclick="abrirModalCadastrar()">
                <span class="material-symbols-outlined" style="font-size:16px">add</span>
                Cadastrar
              </button>
              <button class="btn btn--outline" onclick="toggleFiltros()">
                <span class="material-symbols-outlined" style="font-size:16px">filter_alt</span>
                <span id="btnFiltroLabel">Filtrar</span>
              </button>
            </div>
          </div>

          <!-- Advanced Filters -->
          <div id="filtrosAvancados" class="searchbar__filters" style="display:none">
            <input
              id="inputCategoria"
              class="searchbar__input"
              type="text"
              placeholder="Categoria"
              oninput="filtrarTabela()"
            />
            <select id="selectSituacao" class="searchbar__select" onchange="filtrarTabela()">
              <option value="">Situação</option>
              <option value="0">Pendente</option>
              <option value="1">Aprovada</option>
              <option value="2">Rejeitada</option>
            </select>
            <button class="btn btn--outline" onclick="limparFiltros()">Limpar</button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Descrição</th>
                  <th>Valor</th>
                  <th>Data</th>
                  <th>Categoria</th>
                  <th>Situação</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaCorpo">
                <!-- preenchido via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- ==================== MODAL CADASTRAR ==================== -->
    <div id="modalCadastrar" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal__title">Cadastrar Despesa</h2>
        <div class="form-group">
          <label for="formDescricao">Descrição</label>
          <input id="formDescricao" type="text" placeholder="Descrição da despesa" />

          <label for="formValor">Valor (R$)</label>
          <input id="formValor" type="number" placeholder="0.00" step="0.01" min="0" />

          <label for="formData">Data</label>
          <input id="formData" type="date" />

          <label for="formCategoria">Categoria</label>
          <input id="formCategoria" type="text" placeholder="Ex: Saúde, Educação" />

          <label for="formSituacao">Situação</label>
          <select id="formSituacao">
            <option value="0">Pendente</option>
            <option value="1">Aprovada</option>
            <option value="2">Rejeitada</option>
          </select>
        </div>
        <div class="modal__footer">
          <button class="btn btn--cancel" onclick="fecharModalCadastrar()">Cancelar</button>
          <button class="btn btn--primary" onclick="cadastrarDespesa()">Cadastrar</button>
        </div>
      </div>
    </div>

    <!-- ==================== MODAL EDITAR ==================== -->
    <div id="modalEditar" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal__title">Editar Despesa</h2>
        <div class="form-group">
          <input id="editId" type="hidden" />

          <label for="editDescricao">Descrição</label>
          <input id="editDescricao" type="text" />

          <label for="editValor">Valor (R$)</label>
          <input id="editValor" type="number" step="0.01" min="0" />

          <label for="editData">Data</label>
          <input id="editData" type="date" />

          <label for="editCategoria">Categoria</label>
          <input id="editCategoria" type="text" />

          <label for="editSituacao">Situação</label>
          <select id="editSituacao">
            <option value="0">Pendente</option>
            <option value="1">Aprovada</option>
            <option value="2">Rejeitada</option>
          </select>
        </div>
        <div class="modal__footer">
          <button class="btn btn--cancel" onclick="fecharModalEditar()">Cancelar</button>
          <button class="btn btn--primary" onclick="salvarEdicao()">Salvar</button>
        </div>
      </div>
    </div>

    <!-- ==================== MODAL VISUALIZAR ==================== -->
    <div id="modalVisualizar" class="modal-overlay hidden">
      <div class="modal">
        <h2 class="modal__title">Visualizar Despesa</h2>
        <div id="modalVisualizarConteudo" class="form-group"></div>
        <div class="modal__footer">
          <button class="btn btn--cancel" onclick="fecharModalVisualizar()">Fechar</button>
        </div>
      </div>
    </div>

    <!-- ==================== SCRIPT ==================== -->
    <script>
      /* ---- Dados de exemplo ---- */
      const situacaoLabels = ['Pendente', 'Aprovada', 'Rejeitada'];
      const situacaoBadgeClass = ['badge--pendente', 'badge--aprovada', 'badge--rejeitada'];

      let despesas = [
        { id: 1, descricao: 'Compra de material escolar', valor: 350.00, data: '2025-03-10', categoria: 'Educação', situacao: 1 },
        { id: 2, descricao: 'Manutenção de equipamentos', valor: 1200.50, data: '2025-03-15', categoria: 'Manutenção', situacao: 0 },
        { id: 3, descricao: 'Aquisição de medicamentos', valor: 870.00, data: '2025-03-18', categoria: 'Saúde', situacao: 2 },
        { id: 4, descricao: 'Serviços de limpeza', valor: 450.00, data: '2025-03-20', categoria: 'Serviços', situacao: 1 },
        { id: 5, descricao: 'Transporte escolar', valor: 2300.00, data: '2025-03-22', categoria: 'Transporte', situacao: 0 },
      ];

      let filtrado = [...despesas];
      let proximoId = despesas.length + 1;

      /* ---- Formatar valor ---- */
      function formatarValor(valor) {
        return 'R$ ' + parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      /* ---- Renderizar tabela ---- */
      function renderizarTabela(dados) {
        const corpo = document.getElementById('tabelaCorpo');
        if (dados.length === 0) {
          corpo.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:1rem;color:#6b7280">Nenhum dado encontrado.</td></tr>';
          return;
        }
        corpo.innerHTML = dados.map(d => `
          <tr>
            <td>${d.id}</td>
            <td>${d.descricao}</td>
            <td>${formatarValor(d.valor)}</td>
            <td>${d.data}</td>
            <td>${d.categoria}</td>
            <td><span class="badge ${situacaoBadgeClass[d.situacao]}">${situacaoLabels[d.situacao]}</span></td>
            <td class="table__actions">
              <button class="table__action-btn" title="Visualizar" onclick="visualizarDespesa(${d.id})">
                <span class="material-symbols-outlined">visibility</span>
              </button>
              <button class="table__action-btn" title="Editar" onclick="editarDespesa(${d.id})">
                <span class="material-symbols-outlined">edit_square</span>
              </button>
              <button class="table__action-btn" title="Excluir" onclick="excluirDespesa(${d.id})">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </td>
          </tr>
        `).join('');
      }

      /* ---- Filtrar ---- */
      function normalizar(texto) {
        return String(texto).toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\s]/g, '').trim();
      }

      function filtrarTabela() {
        const descricao = normalizar(document.getElementById('inputDescricao').value);
        const categoria = normalizar(document.getElementById('inputCategoria').value);
        const situacao = document.getElementById('selectSituacao').value;

        filtrado = despesas.filter(d => {
          const okDescricao = !descricao || normalizar(d.descricao).includes(descricao);
          const okCategoria = !categoria || normalizar(d.categoria).includes(categoria);
          const okSituacao = situacao === '' || String(d.situacao) === situacao;
          return okDescricao && okCategoria && okSituacao;
        });
        renderizarTabela(filtrado);
      }

      function limparFiltros() {
        document.getElementById('inputDescricao').value = '';
        document.getElementById('inputCategoria').value = '';
        document.getElementById('selectSituacao').value = '';
        filtrado = [...despesas];
        renderizarTabela(filtrado);
      }

      /* ---- Toggle filtros avançados ---- */
      function toggleFiltros() {
        const el = document.getElementById('filtrosAvancados');
        const label = document.getElementById('btnFiltroLabel');
        const aberto = el.style.display !== 'none';
        el.style.display = aberto ? 'none' : 'flex';
        label.textContent = aberto ? 'Filtrar' : 'Ocultar';
      }

      /* ---- Modal Cadastrar ---- */
      function abrirModalCadastrar() {
        document.getElementById('modalCadastrar').classList.remove('hidden');
      }

      function fecharModalCadastrar() {
        document.getElementById('modalCadastrar').classList.add('hidden');
        ['formDescricao','formValor','formData','formCategoria'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('formSituacao').value = '0';
      }

      function cadastrarDespesa() {
        const descricao = document.getElementById('formDescricao').value.trim();
        const valor = parseFloat(document.getElementById('formValor').value);
        const data = document.getElementById('formData').value;
        const categoria = document.getElementById('formCategoria').value.trim();
        const situacao = parseInt(document.getElementById('formSituacao').value);

        if (!descricao || isNaN(valor) || !data || !categoria) {
          alert('Preencha todos os campos obrigatórios.');
          return;
        }

        const nova = { id: proximoId++, descricao, valor, data, categoria, situacao };
        despesas.push(nova);
        filtrado = [...despesas];
        renderizarTabela(filtrado);
        fecharModalCadastrar();
      }

      /* ---- Modal Editar ---- */
      function editarDespesa(id) {
        const d = despesas.find(x => x.id === id);
        if (!d) return;
        document.getElementById('editId').value = d.id;
        document.getElementById('editDescricao').value = d.descricao;
        document.getElementById('editValor').value = d.valor;
        document.getElementById('editData').value = d.data;
        document.getElementById('editCategoria').value = d.categoria;
        document.getElementById('editSituacao').value = d.situacao;
        document.getElementById('modalEditar').classList.remove('hidden');
      }

      function fecharModalEditar() {
        document.getElementById('modalEditar').classList.add('hidden');
      }

      function salvarEdicao() {
        const id = parseInt(document.getElementById('editId').value);
        const descricao = document.getElementById('editDescricao').value.trim();
        const valor = parseFloat(document.getElementById('editValor').value);
        const data = document.getElementById('editData').value;
        const categoria = document.getElementById('editCategoria').value.trim();
        const situacao = parseInt(document.getElementById('editSituacao').value);

        if (!descricao || isNaN(valor) || !data || !categoria) {
          alert('Preencha todos os campos obrigatórios.');
          return;
        }

        const idx = despesas.findIndex(x => x.id === id);
        if (idx !== -1) {
          despesas[idx] = { id, descricao, valor, data, categoria, situacao };
        }
        filtrado = [...despesas];
        renderizarTabela(filtrado);
        fecharModalEditar();
      }

      /* ---- Modal Visualizar ---- */
      function visualizarDespesa(id) {
        const d = despesas.find(x => x.id === id);
        if (!d) return;
        const conteudo = document.getElementById('modalVisualizarConteudo');
        conteudo.innerHTML = `
          <p><strong>ID:</strong> ${d.id}</p>
          <p><strong>Descrição:</strong> ${d.descricao}</p>
          <p><strong>Valor:</strong> ${formatarValor(d.valor)}</p>
          <p><strong>Data:</strong> ${d.data}</p>
          <p><strong>Categoria:</strong> ${d.categoria}</p>
          <p><strong>Situação:</strong> <span class="badge ${situacaoBadgeClass[d.situacao]}">${situacaoLabels[d.situacao]}</span></p>
        `;
        document.getElementById('modalVisualizar').classList.remove('hidden');
      }

      function fecharModalVisualizar() {
        document.getElementById('modalVisualizar').classList.add('hidden');
      }

      /* ---- Excluir ---- */
      function excluirDespesa(id) {
        if (!confirm('Tem certeza que deseja excluir esta despesa?')) return;
        despesas = despesas.filter(d => d.id !== id);
        filtrado = [...despesas];
        renderizarTabela(filtrado);
      }

      /* ---- Fechar modal ao clicar fora ---- */
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', function(e) {
          if (e.target === this) {
            this.classList.add('hidden');
          }
        });
      });

      /* ---- Render inicial ---- */
      renderizarTabela(despesas);
    </script>
  </body>
</html>
