name: Build check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./civitas-frontend

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ./civitas-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar lint, formatação e imports com Biome
        run: npm run check

      - name: Rodar build
        run: npm run build
